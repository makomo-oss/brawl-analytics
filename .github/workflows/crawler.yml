name: Data Crawler and Bulk Aggregation

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  trigger-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 - Wake-up Ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Waking up Render server at $RENDER_URL/ping"
          # 10秒おきに最大6回(約1分)ポーリングして200 OKを待つ
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/ping")
            if [ "$STATUS" -eq 200 ]; then
              echo "Server is awake (200 OK)!"
              break
            fi
            echo "Server returned $STATUS. Waiting 10 seconds... (Attempt $i/6)"
            sleep 10
          done
          
      - name: Phase 2 - Trigger Batch
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering background task at $RENDER_URL/api/cron/run-batch"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_URL/api/cron/run-batch" -H "cron-secret: $CRON_SECRET")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          
          echo "Response Body: $BODY"
          echo "Response Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to trigger batch processing. Exiting."
            exit 1
          fi
          echo "Batch processing triggered successfully."
