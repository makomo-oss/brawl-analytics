name: DB Retention Audit

on:
  workflow_dispatch:

jobs:
  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 - Wake-up Ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Waking up Render server at $RENDER_URL/ping"
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/ping")
            if [ "$STATUS" -eq 200 ]; then
              echo "Server is awake (200 OK)!"
              break
            fi
            echo "Server returned $STATUS. Waiting 10 seconds... (Attempt $i/6)"
            sleep 10
          done
          
      - name: Phase 2 - Read retention counts
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering read-only retention audit at $RENDER_URL/api/cron/db-cleanup"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_URL/api/cron/db-cleanup" -H "cron-secret: $CRON_SECRET")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          
          echo "Response Body: $BODY"
          echo "Response Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to trigger retention audit. Exiting."
            exit 1
          fi
          echo "Retention audit triggered successfully."
