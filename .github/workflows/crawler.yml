name: Data Crawler and Bulk Aggregation

on:
  schedule:
    - cron: '17,47 * * * *' # A second chance when GitHub drops a scheduled run
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: brawl-crawler
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip the backup slot after a recent success
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SUCCESS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow crawler.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty' 2>/dev/null) || LAST_SUCCESS=""
          if [ -n "$LAST_SUCCESS" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_SUCCESS" +%s) ))
            if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 2700 ]; then
              echo "A crawler run succeeded ${AGE}s ago; skipping this backup slot."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  trigger-batch:
    needs: cadence
    if: needs.cadence.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 - Wake-up Ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Waking up Render server at $RENDER_URL/ping"
          # 10秒おきに最大6回(約1分)ポーリングして200 OKを待つ
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/ping")
            if [ "$STATUS" -eq 200 ]; then
              echo "Server is awake (200 OK)!"
              break
            fi
            echo "Server returned $STATUS. Waiting 10 seconds... (Attempt $i/6)"
            sleep 10
          done
          
      - name: Phase 2 - Trigger Batch
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS --max-time 30 -X POST "$RENDER_URL/api/cron/run-batch" -H "cron-secret: $CRON_SECRET")
          RUN_ID=$(printf '%s' "$RESPONSE" | jq -er '.run_id')
          echo "Batch accepted: $RUN_ID"
          for i in {1..180}; do
            STATUS_FILE="$RUNNER_TEMP/batch-status.json"
            if ! HTTP_CODE=$(curl -sS --max-time 30 -o "$STATUS_FILE" -w '%{http_code}' -H "cron-secret: $CRON_SECRET" "$RENDER_URL/api/cron/batch-status/$RUN_ID"); then
              echo "Batch status request timed out; retrying."
              sleep 10
              continue
            fi
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "Batch status unavailable (HTTP $HTTP_CODE)."
              exit 1
            fi
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Batch status returned HTTP $HTTP_CODE; retrying."
              sleep 10
              continue
            fi
            STATUS=$(jq -r '.status' "$STATUS_FILE")
            if [ "$STATUS" = "completed" ]; then
              jq '{status, stage, result}' "$STATUS_FILE"
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              jq '{status, stage, error_type, error_code, error_column}' "$STATUS_FILE"
              exit 1
            fi
            sleep 10
          done
          echo "Batch did not complete within 30 minutes."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore encrypted history input
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .analytics-cache/history.bin
          key: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Aggregate the saved battles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANALYTICS_HISTORY_CACHE: ${{ github.workspace }}/.analytics-cache/history.bin
        working-directory: backend
        run: python app/scripts/daily_calc.py

      - name: Save encrypted history input
        if: always() && hashFiles('.analytics-cache/history.bin') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .analytics-cache/history.bin
          key: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh the live Tier cache
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --show-error --silent --retry 3 -X POST "$RENDER_URL/meta/clear-cache" -H "cron-secret: $CRON_SECRET"
