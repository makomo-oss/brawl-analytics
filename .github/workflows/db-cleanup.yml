name: Daily DB Cleanup

on:
  schedule:
    - cron: '30 4 * * *' # Daily at 13:30 JST
  workflow_dispatch:

jobs:
  trigger-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 - Wake-up Ping
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Waking up Render server at $RENDER_URL/ping"
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/ping")
            if [ "$STATUS" -eq 200 ]; then
              echo "Server is awake (200 OK)!"
              break
            fi
            echo "Server returned $STATUS. Waiting 10 seconds... (Attempt $i/6)"
            sleep 10
          done
          
      - name: Phase 2 - Delete expired battles and verify completion
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS --max-time 120 -X POST "$RENDER_URL/api/cron/db-cleanup" -H "cron-secret: $CRON_SECRET")
          printf '%s' "$RESPONSE" | jq -e '{status, deleted_count, remaining_expired}'
          printf '%s' "$RESPONSE" | jq -e '.status == "completed" and .remaining_expired == 0' >/dev/null
