name: Daily Tier Calc

on:
  schedule:
    - cron: '0 7,19 * * *' # Twice a day at 4:00 AM and 4:00 PM JST
  workflow_dispatch:

jobs:
  run-calc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Restore encrypted history input
        # History is authenticated/encrypted; never cache plaintext player data.
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .analytics-cache/history.bin
          key: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Calculate using refreshed history partitions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANALYTICS_HISTORY_CACHE: ${{ github.workspace }}/.analytics-cache/history.bin
        run: |
          cd backend
          python app/scripts/daily_calc.py

      - name: Save encrypted history input
        if: always() && hashFiles('.analytics-cache/history.bin') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .analytics-cache/history.bin
          key: analytics-history-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh the live Tier cache
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --show-error --silent -X POST "$RENDER_URL/meta/clear-cache" -H "cron-secret: $CRON_SECRET"
